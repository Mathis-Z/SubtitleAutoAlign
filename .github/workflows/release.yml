name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version to release, e.g. 1.0.0.0'
        required: true
        type: string
      changelog:
        description: 'Changelog entry for this release'
        required: false
        type: string
        default: 'See release notes.'

permissions:
  contents: write

env:
  TARGET_ABI: '12.1.0.0'
  PLUGIN_PROJECT: src/Jellyfin.Plugin.SubtitleAutoAlign
  ARTIFACT_NAME: subtitle-auto-align-${{ github.event.inputs.version }}

jobs:
  build-ffsubsync:
    # Builds a standalone, PyInstaller-frozen ffsubsync binary for linux-x64 so
    # the plugin can ship it and avoid requiring a separate Python install on
    # the Jellyfin host. ffmpeg itself is NOT bundled here: ffsubsync only
    # needs it at runtime for audio extraction, and Jellyfin already ships its
    # own ffmpeg, so the plugin can point at that instead.
    #
    # PyInstaller cannot cross-compile, so binaries for other platforms
    # (linux-arm64, windows, macOS) would each need their own native runner;
    # only linux-x64 is built for now, per current scope. On unbundled
    # platforms the plugin falls back to "ffsubsync" resolved via PATH.
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffsubsync and PyInstaller
        run: pip install ffsubsync pyinstaller

      - name: Write PyInstaller entry point
        run: |
          cat > ffsubsync_entry.py <<'PYEOF'
          import sys

          from ffsubsync.ffsubsync import main

          if __name__ == "__main__":
              sys.exit(main())
          PYEOF

      - name: Write PyInstaller hook for webrtcvad
        run: |
          # webrtcvad is ffsubsync's default speech detector, so it must be
          # bundled. The module ships in the "webrtcvad-wheels" distribution,
          # but PyInstaller's stock hook copies metadata for "webrtcvad" and
          # crashes. Hooks from --additional-hooks-dir take precedence.
          mkdir -p pyinstaller-hooks
          cat > pyinstaller-hooks/hook-webrtcvad.py <<'PYEOF'
          from PyInstaller.utils.hooks import copy_metadata

          datas = copy_metadata("webrtcvad-wheels")
          PYEOF

      - name: Build standalone binary
        run: |
          pyinstaller --onefile --name ffsubsync \
            --additional-hooks-dir pyinstaller-hooks \
            --collect-all ffsubsync \
            --collect-all auditok \
            --hidden-import webrtcvad \
            ffsubsync_entry.py

      - name: Smoke test binary with a real alignment
        run: |
          # --help alone never loads the speech detector; run an actual
          # alignment, with ffmpeg reachable only via --ffmpeg-path like on
          # a Jellyfin server.
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          mkdir -p ffmpeg-dir
          ln -s "$(command -v ffmpeg)" ffmpeg-dir/ffmpeg
          ln -s "$(command -v ffprobe)" ffmpeg-dir/ffprobe
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=440:duration=6" \
            -f lavfi -i color=c=black:s=64x64:d=6 -shortest smoke.mp4
          printf '1\n00:00:01,000 --> 00:00:03,000\nhello\n\n2\n00:00:04,000 --> 00:00:05,000\nworld\n' > smoke.srt
          env PATH=/nonexistent ./dist/ffsubsync smoke.mp4 -i smoke.srt -o smoke.out.srt --ffmpeg-path "$PWD/ffmpeg-dir"
          test -s smoke.out.srt

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ffsubsync-linux-x64
          path: dist/ffsubsync
          if-no-files-found: error

  release:
    needs: build-ffsubsync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish plugin
        run: |
          dotnet publish "${{ env.PLUGIN_PROJECT }}" \
            -c Release \
            -p:Version=${{ github.event.inputs.version }} \
            -o out

      - name: Download bundled ffsubsync binary
        uses: actions/download-artifact@v4
        with:
          name: ffsubsync-linux-x64
          path: out/bundled/linux-x64

      - name: Mark bundled binary executable
        run: chmod +x out/bundled/linux-x64/ffsubsync

      - name: Package zip
        run: |
          cd out
          zip -r --symlinks "../${{ env.ARTIFACT_NAME }}.zip" .
          cd ..

      - name: Compute checksum
        id: checksum
        run: |
          CHECKSUM=$(md5sum "${{ env.ARTIFACT_NAME }}.zip" | awk '{print $1}')
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Update manifest.json
        env:
          VERSION: ${{ github.event.inputs.version }}
          CHANGELOG: ${{ github.event.inputs.changelog }}
          CHECKSUM: ${{ steps.checksum.outputs.checksum }}
          TARGET_ABI: ${{ env.TARGET_ABI }}
          SOURCE_URL: https://github.com/${{ github.repository }}/releases/download/v${{ github.event.inputs.version }}/${{ env.ARTIFACT_NAME }}.zip
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          from datetime import datetime, timezone

          with open("manifest.json", "r", encoding="utf-8") as f:
              manifest = json.load(f)

          entry = {
              "version": os.environ["VERSION"],
              "changelog": os.environ["CHANGELOG"],
              "targetAbi": os.environ["TARGET_ABI"],
              "sourceUrl": os.environ["SOURCE_URL"],
              "checksum": os.environ["CHECKSUM"],
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }

          plugin = manifest[0]
          plugin.setdefault("versions", [])
          plugin["versions"] = [v for v in plugin["versions"] if v["version"] != entry["version"]]
          plugin["versions"].insert(0, entry)

          with open("manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PYEOF

      - name: Commit manifest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --staged --quiet && echo "No manifest.json changes to commit" || git commit -m "Release v${{ github.event.inputs.version }}"
          git push

      - name: Delete existing release and tag, if any
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Re-running the workflow for a version that was already released
          # replaces that release rather than failing on a duplicate tag.
          gh release delete "v${{ github.event.inputs.version }}" --yes --cleanup-tag || true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.event.inputs.version }}" \
            "${{ env.ARTIFACT_NAME }}.zip" \
            --title "v${{ github.event.inputs.version }}" \
            --notes "${{ github.event.inputs.changelog }}"
